# 业务参数（wallet.*）：变更频率最高的一类，只影响业务行为，不碰基础设施。
# 真实支付渠道（Antom 等）的商户配置不在这里——落 channel_config 表，改库即生效（缓存 30 秒）。
wallet:
  pay:
    expire-minutes: 15        # 支付单超时分钟数
    points-per-yuan: 100      # 100 积分抵 1 元
  password:
    max-continuous-fail: 5    # 连续错 5 次锁定
    max-daily-fail: 10        # 当日错 10 次锁定
    lock-minutes: 10
    ticket-ttl-seconds: 300
    bcrypt-strength: 12
  pay-security:
    enabled: true
    enforce-version: -1
    authorization-ttl-seconds: 300
    challenge-ttl-seconds: 120
    business-zone-id: Asia/Shanghai
    # 生产环境必须通过配置中心覆盖；变更会使在途短信频控键失效。
    phone-hash-pepper: ${WALLET_PAY_SECURITY_PHONE_PEPPER:change-me-before-production}
