# 监控与日志级别。
# /actuator/health 健康检查、/actuator/prometheus 供 Prometheus 抓取
# （JVM/CPU/GC 自动上报；QPS/RT 看 http_server_requests_seconds 指标；Grafana 面板服务端配）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# 日志格式/滚动/traceId 输出统一在 logback-spring.xml；这里只调级别
logging:
  level:
    com.wallet: info
