server:
  port: 8080

spring:
  application:
    name: wallet
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wallet?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ''
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 支付编排配置
wallet:
  pay:
    expire-minutes: 15        # 支付单超时分钟数
    points-per-yuan: 100      # 100 积分抵 1 元
  password:
    max-continuous-fail: 5    # 连续错 5 次锁定
    max-daily-fail: 10        # 当日错 10 次锁定
    lock-minutes: 10
    ticket-ttl-seconds: 300
    bcrypt-strength: 12
  mock:
    delay-ms: 100             # 渠道模拟网络延迟
    fail-rate: 0.0            # 下单失败概率（0~1），联调失败路径可临时调高
    notify-seconds: 5         # 下单后 N 秒自动回调；0=手工触发回调接口
    refund-fail: false        # 退款强制失败开关
    secret: mock-secret       # mock 回调验签 token
  # Antom（支付宝国际）真实渠道：默认关闭，配好密钥后置 enabled=true 即启用
  antoom:
    enabled: false
    gateway: https://globalapi.alipay.com
    client-id: ''
    merchant-private-key: ''
    alipay-public-key: ''
    base-url: http://localhost:8080
    expiry-minutes: 10

logging:
  level:
    com.wallet: info
