# 主入口：只放应用标识、端口与配置装配清单，具体配置按主题拆分在 config/ 下。
#
# 覆盖优先级（低 → 高）：import 的主题文件 < 本文件 < application-{env}.yml（环境差异用 profile 覆盖，
# 不要改主题文件）。按主题拆文件、按环境拆 profile，两者正交。
server:
  port: 8080

spring:
  application:
    name: wallet
  config:
    import:
      - classpath:config/infra.yml     # 基础能力：数据源/Redis/MyBatis-Plus/lock4j/XXL-Job/Web 格式/接口文档
      - classpath:config/biz.yml       # 业务参数：wallet.*（支付/密码/Antom）
      - classpath:config/mock.yml      # Mock 渠道（仅联调；生产可从清单移除）
      - classpath:config/monitor.yml   # 监控与日志级别
